name: Progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: progress
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate progress visualizer & raw data
        run: |
          python3 tools/progress.py docs
          python3 tools/progress.py out

      - name: Publish GitHub Step Summary
        run: |
          python3 tools/progress.py --summary >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: progress-dashboard
          path: out/
          if-no-files-found: ignore

      - name: Commit updated progress visuals to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/progress.svg docs/progress.json docs/badge-*.svg
          git diff --staged --quiet || (git commit -m "chore(progress): mise à jour de la carte SVG et des métriques [skip ci]" && git push)
